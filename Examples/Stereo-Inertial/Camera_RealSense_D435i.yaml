%YAML:1.0
File.version: "1.0"

#--------------------------------------------------------------------------------------------
# Camera Parameters (calibration and biases vary from camera to camera)
#--------------------------------------------------------------------------------------------

Camera.type: "Rectified"

# Rectified Camera calibration (OpenCV)
Camera1.fx: 421.524
Camera1.fy: 421.524
Camera1.cx: 424.973
Camera1.cy: 239.928

Stereo.b: 0.0499585

# Camera resolution
Camera.width: 848
Camera.height: 480

# Camera frames per second
Camera.fps: 15

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0


# ===================== TODO ========================
# Delete this when mpImuCalib is moved out of Tracking
# Transformation from body-frame (imu) to left camera
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [1.0, 0.0, 0.0, 0.00552,
          0.0, 1.0, 0.0, -0.00510,
          0.0, 0.0, 1.0, -0.01174,
          0.0, 0.0, 0.0, 1.0]

# IMU noise (Use those from VINS-mono)
IMU.NoiseGyro:  0.008449 # 1e-3 # rad/s^0.5 # 1e-3 2.44e-4
IMU.NoiseAcc: 0.01066 # 1e-2 # m/s^1.5 # 1e-2 1.47e-3
IMU.GyroWalk: 0.000754 # rad/s^1.5  1e-6 
IMU.AccWalk: 0.00930 # m/s^2.5  1e-4 
IMU.AccFrequency: 250.0
IMU.GyroFrequency: 200.0
# =================================================